# Martin Strategy · Crypto · Live —— 实盘配置
# 账户规模：100 USDT ｜ 交易所：OKX ｜ 默认模拟盘
# 上层参数来源：../config.yaml（v2.0 + 加密特化）
# ⚠️ 本文件的账户相关参数是按「100 USDT」算的，换账户规模必须重算并注释原因

account:
  equity_usdt: 3000         # 仅作参考，实际用 API 查到的权益
  equity_cap_usdt: 0        # 0 = 不限制，直接用 API 实际权益；按百分比算仓位
  exchange: "okx"
  demo: true                # true=模拟盘（x-simulated-trading:1）；跑通后改 false
  margin_mode: "cross"      # 全仓
  pos_mode: "long_short"    # 双向持仓（OKX 切账户模式后变成 long_short_mode）
  pos_side: "long"          # 双向持仓模式下单必须带 posSide，不能传 net

# ============ 标的（先小范围跑通，稳定后再扩）============
universe:
  # ⚠️ 必须只放 instCategory=1（纯加密）的合约。
  # OKX 把股票(GOOGL/INTC/SOXL, instCategory=3)与商品(XAU黄金/CL原油, instCategory=4)
  # 也做成了 USDT 永续，它们有交易时段限制、周末数据缺口，会让 5m 指标失真。
  # 本池 = ADTV>=1亿 且 instCategory=1，共 19 个（2026-10-30 快照，按成交额降序）
  inst_category: 1
  symbols:
    - "BTC-USDT-SWAP"      # 134.4 亿
    - "ETH-USDT-SWAP"      # 126.2 亿
    - "ZEC-USDT-SWAP"      # 19.5 亿
    - "SOL-USDT-SWAP"      # 19.2 亿
    - "HYPE-USDT-SWAP"     # 12.7 亿
    - "PEPE-USDT-SWAP"     # 7.9 亿
    - "XRP-USDT-SWAP"      # 5.7 亿
    - "DOGE-USDT-SWAP"     # 4.2 亿
    - "NEAR-USDT-SWAP"     # 3.6 亿
    - "BNB-USDT-SWAP"      # 3.0 亿
    - "UNI-USDT-SWAP"      # 2.6 亿
    - "WLD-USDT-SWAP"      # 2.1 亿
    - "ENA-USDT-SWAP"      # 1.9 亿
    - "PARTI-USDT-SWAP"    # 1.9 亿
    - "PUMP-USDT-SWAP"     # 1.8 亿
    - "TRX-USDT-SWAP"      # 1.5 亿
    - "SUI-USDT-SWAP"      # 1.5 亿
    - "TRUMP-USDT-SWAP"    # 1.1 亿
    - "LIT-USDT-SWAP"      # 1.0 亿

# ============ 时段（加密特化 §1.1）============
session:
  # 实测（30天×5标的，V型反转后2h上涨占比）：
  #   09:00-10:00 52% ｜ 10:00-11:00 62% ｜ 13:00 48% ｜ 14:00 40% ｜ 15:00 27% ｜ 16:00 46%
  # 原本只开主窗口 = 每天 2 小时，22 小时完全不看盘，实测成为最大瓶颈
  # （19 个标的中已有 1 个通过日线，但因不在时段连 5m 都不检查）。
  # 现改为「除回避窗口外全天可交易」：机会 ×11，代价是夜盘胜率略低。
  mode: "all_except_avoid"        # all_except_avoid | window_only
  primary_utc:   ["09:00", "11:00"]   # 质量最好的窗口（保留标注，用于日志区分）
  secondary_utc: ["03:00", "05:00"]
  avoid_utc:     ["14:00", "16:00"]   # 最活跃但胜率最低（27%-40%），仍回避
  allow_secondary: true

# ============ 仓位（按 100 USDT 重算）============
position:
  risk_per_trade_pct: 0.5             # 单笔风险 0.5% = 0.50 USDT
  max_positions: 6                    # ⚠️ 100 USDT × 2x = 200 名义；每笔 33 USDT → 最多 6 笔
  max_same_direction: 6               # 仅做多，故与总上限一致
  max_new_per_day: 4                  # 小账户降频，先观察
  leverage_set: 3                     # 交易所设置值（留缓冲）
  leverage_effective_max: 2.6         # 实际使用的名义 / 权益 上限
  single_position_max_pct: 33.0       # 单笔名义 ≤ 账户 33%
  min_notional_usdt: 15               # 低于此名义不开仓（避免手续费占比过高）

# ============ 信号条件（此前缺失，参数硬编码在代码里，现补齐）============
signal:
  pullback:
    e1_days_max: 30                 # 距最近突破日 ≤ N 天（严格通道）
    e1_relaxed_dev_pct: 5.0         # 放宽通道：日线收盘距 EMA21 < X% 时，突破多久不重要
    e3_ema21_dev_max: 15.0          # 位置：偏离 EMA21 < X%
    e3_weekly_up_max: 4             # 连涨周数 < N
    support_overlap_min: 2          # 支撑四要素重合 ≥ N（尚未实现）
    support_distance_max_pct: 1.0   # 或距最近支撑 ≤ X%（尚未实现）

# ============ 止损（v2.0 区间判定）============
stoploss:
  s_max:
    atr_daily_mult: 0.5
    adr_ratio: 0.5
    hard_cap_pct: 5.0
  s_min:
    floor_pct: 0.5
    atr_5m_mult: 3.0
  candidates_priority: ["day_low", "trigger_bar_low", "prev_bar_low"]
  # 交易所侧止损单：触发后按市价成交
  order_type: "conditional"           # OKX algo order
  trigger_by: "mark"                  # mark / last；用标记价避免插针误触

# ============ 出场（简化到 100 刀能跑的最小集）============
exit:
  breakeven: "ema9_daily_above_entry" # 止损上移到成本
  trail: "ema9_daily_minus_0.1atr5m"  # 日线 EMA9 下方一点，只升不降
  first_trim:
    r_threshold: 5                    # 首批 R 门槛（机械规则用；LLM 判断也参考它）
    trim_pct: 15                      # 机械规则减仓比例
    r_threshold_grid: [3, 5, 12, 15]  # 卡片「参考目标」展示用的 R 档位
    extension_check:                  # 「1h 图离均线很远」的判定（is_extended 用）
      timeframe: "1h"
      ema_period: 21
      atr_period: 14
      atr_mult: 1.0
      consecutive_closes: 3
  time_stop:
    days_soft: 15
    days_hard: 30

# ============ 风控 ============
risk:
  circuit_breaker:
    daily_loss_pct: 2.5               # 100 USDT → 2.50 USDT
    weekly_loss_pct: 5.0
    consecutive_stops_pause: 6
    pause_hours: 24
  adaptive:
    after_2_consecutive_stops: 0.25   # 风险降到 0.25%
    cap_pct: 1.0

# ============ 手续费与滑点（实盘记账用）============
cost:
  taker_pct: 0.05                     # OKX 普通用户 Lv1；有 OKB 抵扣会更低
  maker_pct: 0.02
  entry_order_type: "market"          # 盘中触发必须市价，才能"过去就买"
  slippage_assumed_pct: 0.03          # 33 USDT 名义在主流币上滑点极小

# ============ 运行 ============
runtime:
  poll_seconds: 60                    # 主循环间隔
  daily_rebuild_utc: "08:00"
  state_file: "state.json"            # 持仓与熔断状态持久化
  log_file: "logs/live.log"
  dry_run: false                      # 已通过五步验证，改为 true 可回到只观察模式

# ============ 通知 ============
notify:
  feishu: true                      # 关闭后不发任何卡片
  # webhook 放 .env 的 FEISHU_WEBHOOK，不进 git

# ============ 止盈判断器（LLM 综合判断）============
advisor:
  enabled: true
  trigger_min_r: 3.0                # 浮盈达多少 R 才触发判断（最低档）
  min_interval_hours: 4             # 同一笔交易两次判断的最小间隔，防刷
  max_trim_pct_per_call: 50         # 单次减仓比例上限（LLM 只能给 15/30/50）
  min_confidence: 0.6               # 低于此置信度一律 hold，不动作
  temperature: 0                   # 0 = 尽量确定性，减少同输入不同结论
  max_tokens: 4000                  # 实测 1200 会全被 reasoning 吃掉、content 为空；4000 够用
  timeout_seconds: 120              # 实测单次判断耗时 10-25s
  # 凭证放 .env：ARK_API_KEY / ARK_BASE_URL / ARK_MODEL
